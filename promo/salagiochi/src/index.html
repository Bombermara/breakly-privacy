<style>

<script>
const $=id=>document.getElementById(id);
const F45=location.search.includes('f45');
const VW=1080,VH=F45?1350:1920;
document.documentElement.style.width=document.body.style.width=VW+'px';
document.documentElement.style.height=document.body.style.height=VH+'px';
const K=F45?0.9:1,OX=(VW-1080*K)/2,OY=(VH-1500*K)/2;
$('core').style.transform=`translate(${OX}px,${OY}px) scale(${K})`;
['back','front'].forEach(id=>{$(id).width=VW;$(id).height=VH});
const toV=(x,y)=>[OX+x*K,OY+y*K];

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3);
const eIn=k=>k*k*k;
const eIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c1=2.0,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const eElastic=k=>k===0?0:k===1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*(2*Math.PI)/3)+1;
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function words(el,txt){el.innerHTML=txt.split(' ').map(w=>w==='/'?'<br>':w[0]==='^'?`<span class="dk">${w.slice(1)}</span>`:w[0]==='*'?`<span class="grad">${w.slice(1)}</span>`:`<span>${w}</span>`).join(' ');return [...el.querySelectorAll('span')]}
function popWords(sp,t,t0,st=.09,dur=.45){sp.forEach((s,i)=>{const k=seg(t,t0+i*st,t0+i*st+dur);
 s.style.opacity=clamp(k*3);s.style.transform=`translateY(${(1-eOut(k))*60}px) scale(${lerp(.3,1,eBack(k))}) rotate(${(1-eOut(k))*-8}deg)`})}

const WK=words($('k1'),'CHI OFFRE IL CAFFÈ OGGI?');
const WH=words($('h1'),'Vinci il mini-gioco / e *salvati *dal *conto.');
const WD=words($('diceIn'),'…o lascia decidere a *Chicca 🎲');
const WE=words($('e1'),'Chi perde, ^offre. ☕');

// neon bulbs
for(let i=0;i<22;i++){const b=document.createElement('div');b.className='bulb';$('bulbs').appendChild(b)}
const BULBS=[...$('bulbs').children];
BULBS.forEach((b,i)=>{const per=2*(800+190);let d=i/BULBS.length*per,x,y;
 if(d<800){x=140+d;y=70}else if(d<990){x=940;y=70+(d-800)}else if(d<1790){x=940-(d-990);y=260}else{x=140;y=260-(d-1790)}
 b.style.left=x+'px';b.style.top=y+'px'});

// game cards (names & colors from the app's "Sala giochi")
const GAMES=[['🔄','Ruota della sorte','linear-gradient(160deg,#7b6cff,#3a7bd5)'],['⏱️','Stop al secondo','linear-gradient(160deg,#2fd39a,#169a57)'],
 ['❓','Quiz lampo','linear-gradient(160deg,#ff8a3d,#d9661c)'],['⚡','Reaction Shot','linear-gradient(160deg,#5b8cff,#c9605a)'],
 ['💧','Perfect Pour','linear-gradient(160deg,#ff8a3d,#e0a020)'],['🔢','Coffee Memory','linear-gradient(160deg,#8b6cff,#2aa7a0)'],
 ['↕️','Higher or Lower','linear-gradient(160deg,#ff5fa2,#8b5cf6)'],['🎞️','Emoji Guess','linear-gradient(160deg,#ffb03a,#ff5f6d)']];
GAMES.forEach((g,i)=>{const d=document.createElement('div');d.className='card';d.style.background=g[2];
 d.innerHTML=`<div class="ic">${g[0]}</div><b>${g[1]}</b><div class="hl"></div>`;$('cards').appendChild(d);
 g.el=d;g.hl=d.querySelector('.hl');g.x=300+(i%2)*480;g.y=400+Math.floor(i/2)*205});
const WIN=3,CH0=6.4,CH1=7.9,STEPS=8*3+WIN;
function chase(t){const k=seg(t,CH0,CH1);return Math.floor(STEPS*(1-Math.pow(1-k,3))+1e-6)}

// phone screens (real screenshots)
const FS=508/921,PH={x:150+16,y:330+16};
const SCREENS=[['s_home',9.2,10.8,40],['s_chi',10.8,12.4,10],['s_come',12.4,14.0,30],['s_classifica',14.0,16,10]];
const CAPS=[[9.4,'Partita rapida o *Team *Ufficio','Gioca al volo o con il tuo gruppo'],[11.0,'Scegli *chi *c\'è *oggi','Contano solo i presenti in pausa'],
 [12.6,'Quick Pick, Mini Game *o *Random','Poco tempo? Chicca sceglie al volo'],[14.2,'La *classifica *dei *caffè','Breakly si ricorda chi ha offerto 😏']];
CAPS.forEach(c=>{const d=document.createElement('div');d.className='cap';d.innerHTML=`<h2></h2><p>${c[2]}</p>`;$('caps').appendChild(d);c.el=d;c.w=words(d.querySelector('h2'),c[1]);c.p=d.querySelector('p')});
const CALL=[['g_home','s_home',40,835,840,425,.72,9.9,10.75],['g_chi','s_chi',40,515,840,320,.72,11.5,12.35],
 ['g_come','s_come',40,590,840,690,.62,13.1,13.95],['g_classifica','s_classifica',40,440,840,300,.74,14.7,15.6]];
CALL.forEach(c=>{const d=document.createElement('div');d.className='callout';const z=c[6];
 Object.assign(d.style,{width:c[4]*z+'px',height:c[5]*z+'px'});
 d.innerHTML=`<img src="${c[0]}.jpg" style="width:${921*z}px;left:${-c[2]*z}px;top:${-c[3]*z}px">`;$('callouts').appendChild(d);c.el=d});

// particles
const bctx=$('back').getContext('2d'),fctx=$('front').getContext('2d');
const R1=rng(42),CONF=[...Array(160)].map(()=>{const a=R1()*6.28,v=700+R1()*1400;return{vx:Math.cos(a)*v,vy:Math.sin(a)*v-700,
 r:R1()*6.28,vr:(R1()-.5)*18,w:14+R1()*16,h:8+R1()*10,c:['#FFB03A','#FF6B2C','#FF3D8B','#fff','#7BE38F','#8FD3FF','#FFE45C'][Math.floor(R1()*7)],sw:R1()*6}});
function confetti(c,t,t0,ox,oy){const d=t-t0;if(d<0||d>3.5)return;CONF.forEach(p=>{const k=(1-Math.exp(-1.6*d))/1.6;
 const x=ox+p.vx*k*K+Math.sin(d*4+p.sw)*30,y=oy+(p.vy*k+900*d*d*.5)*K;c.save();c.globalAlpha=clamp(3.5-d);c.translate(x,y);c.rotate(p.r+p.vr*d);
 c.scale(K,Math.cos(d*8+p.sw)*K);c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()})}
const R2=rng(99),SPK=[...Array(40)].map(()=>({a:R2()*6.28,r:140+R2()*480,d:R2()*1.1,s:6+R2()*16}));
function sparkles(c,t,t0,ox,oy,dur=2){SPK.forEach(p=>{const d=t-t0-p.d;if(d<0||d>dur)return;const k=d/dur;
 const x=ox+Math.cos(p.a)*p.r*(.6+k*.5)*K,y=oy+Math.sin(p.a)*p.r*(.6+k*.5)*K,s=p.s*Math.sin(Math.PI*k)*K;
 c.save();c.translate(x,y);c.rotate(k*3);c.fillStyle='#fff';c.globalAlpha=.9;c.beginPath();
 for(let i=0;i<8;i++){const rr=i%2?s*.25:s,aa=i*Math.PI/4;c.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}c.fill();c.restore()})}

// Chicca
const CH=$('chicca'),ST=$('steam'),BL=$('blink'),SH=$('shadow');
const hop=(t,a)=>-Math.abs(Math.sin(Math.PI*2*t))*a;
const P1={x:540,y:1440,s:.86},P2={x:540,y:1490,s:.45},P2b={x:880,y:1490,s:.45},P3={x:900,y:1490,s:.5},P4={x:540,y:1000,s:.95};
function mv(a,b,k){return{x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),s:lerp(a.s,b.s,k)}}
// finestre in cui Chicca "parla" (bocca animata)
const TALK=[[1.5,3.2],[6.3,7.4],[9.4,10.1],[11.0,11.7],[12.6,13.3],[14.2,14.9],[16.7,17.5]];
function walk(t,a,b){const k=seg(t,a,b);return k>0&&k<1?Math.sin(Math.PI*k):0}
function pose(t){let x,y,s,g,rot=0,sx=1,sy=1,flip=1,arm=0,spin=0;
 if(t<3.8){({x,y,s}=P1);g=y;
  if(t<.9){y=-300}else if(t<1.3){y=lerp(-150,P1.y,eIn(seg(t,.9,1.3)));sx=.88;sy=1.14;arm=-12}
  else{const d=t-1.3,q=.3*Math.exp(-5.5*d)*Math.cos(17*d);sy=1-q;sx=1+q*.8;if(t>2)y+=hop(t,12);rot=Math.sin(t*3)*2;
   // saluto: "ciao!"
   if(t<2.8)arm=Math.sin((t-1.4)*13)*15*seg(t,1.35,1.5)*(1-seg(t,2.6,2.8));else arm=Math.sin(t*6.28)*6;
   // piccolo saltello di entusiasmo sullo slogan
   const j=seg(t,2.95,3.35);if(j>0&&j<1){y-=Math.sin(Math.PI*j)*90;sy=1+.1*Math.sin(Math.PI*j);sx=1-.06*Math.sin(Math.PI*j)}}}
 else if(t<9.2){
  if(t<6.0){const k=eIO(seg(t,3.8,4.2));({x,y,s}=mv(P1,P2,k));}
  else{const k=eIO(seg(t,6.0,6.4));({x,y,s}=mv(P2,P2b,k));}
  g=y;
  const wk=walk(t,3.8,4.2)+walk(t,6.0,6.4);rot+=Math.sin(t*28)*9*wk;y-=Math.abs(Math.sin(t*28))*30*wk;
  if(t>4.1&&t<5.4){const d=((t-4.1)%.15)/.15;rot+=Math.sin(d*Math.PI)*-6;sy=1+.05*Math.sin(d*Math.PI);arm=-14*Math.sin(d*Math.PI*2)-3} // lancia le carte
  else if(t<6.0){y+=hop(t,10);arm=Math.sin(t*6.28)*8;rot+=Math.sin(t*3)*3}
  else if(t<CH1){arm=-6+Math.sin(t*25)*5*(1-seg(t,7.2,CH1));rot+=Math.sin(t*20)*2*(1-seg(t,7.2,CH1));sy=1+.03*Math.sin(t*20)} // trepidazione
  if(t>=CH1){const d=t-CH1,j=clamp(d/.7);
   // salto mortale!
   y-=Math.sin(Math.PI*j)*300;spin=-360*eIO(clamp((d-.05)/.6));arm=-12;
   if(d<.08){sy=.85;sx=1.1}
   const l=d-.7;if(l>0){const q=.25*Math.exp(-6*l)*Math.cos(18*l);sy=1-q;sx=1+q*.8;arm=Math.sin(l*14)*12*Math.exp(-l*2)}}}
 else if(t<15.6){const k=eIO(seg(t,9.2,9.7));({x,y,s}=mv(P2b,P3,k));g=y;
  y+=hop(t,8);rot=Math.sin(t*2.5)*3+Math.sin(t*28)*8*walk(t,9.2,9.7);
  // indica il telefono con enfasi a ogni nuova schermata
  arm=-4;for(const c0 of [9.4,11.0,12.6,14.2]){const d=t-c0;if(d>0&&d<1.2)arm+=-13*Math.sin(Math.min(d*9,Math.PI))*Math.exp(-d*1.5)}
  for(const c0 of [9.9,11.5,13.1,14.7]){const j=seg(t,c0-.05,c0+.3);if(j>0&&j<1){y-=Math.sin(Math.PI*j)*50}}}
 else{const k=seg(t,15.6,16.3);x=lerp(P3.x,P4.x,eOut(k));y=lerp(P3.y,P4.y,eBack(k));s=lerp(P3.s,P4.s,eOut(k));g=P4.y;
  spin=t<16.3?360*eIO(k):0;
  if(t>16.3){const d=t-16.3,q=.18*Math.exp(-5*d)*Math.cos(16*d);sy=1-q;sx=1+q*.8;
   // balletto a tempo
   const dn=seg(t,17.5,17.8);rot=Math.sin(t*3.2)*3*(1-dn)+Math.sin(t*Math.PI*2)*9*dn;y+=hop(t,10)*seg(t,16.8,17.2)+hop(t,14)*dn;
   arm=Math.sin(t*Math.PI*4)*12*dn+Math.sin(t*6)*6*(1-dn);
   const w=seg(t,19.0,19.15);if(t>19.0)arm=Math.sin((t-19)*14)*15;}}
