<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:F;src:url(f600.woff2);font-weight:600}
@font-face{font-family:F;src:url(f700.woff2);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#141021}
body{font-family:F,"Noto Color Emoji",sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
#bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#3a2560 0%,#1d1533 45%,#110d1d 100%)}
#bg2{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#ff9a3c 0%,#ff6b2c 40%,#ff3d8b 100%)}
#rays{position:absolute;left:540px;top:900px;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;border-radius:50%;
 background:repeating-conic-gradient(rgba(255,255,255,.10) 0 10deg,rgba(255,255,255,0) 10deg 20deg);
 -webkit-mask:radial-gradient(circle,#000 0,#000 25%,transparent 60%)}
#glow{position:absolute;width:1100px;height:1100px;border-radius:50%;margin:-550px 0 0 -550px;
 background:radial-gradient(circle,rgba(255,120,50,.45),rgba(255,61,139,.15) 45%,transparent 70%)}
canvas{position:absolute;inset:0}
#chicca{position:absolute;width:620px;height:736px;transform-origin:50% 100%}
#chicca img{position:absolute;left:0;top:0;width:100%;height:100%}
#steam{transform-origin:50% 31.5%}
#shadow{position:absolute;width:420px;height:60px;margin:-30px 0 0 -210px;border-radius:50%;
 background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%)}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:700;line-height:1.08;
 text-shadow:0 8px 30px rgba(0,0,0,.35)}
.t span{display:inline-block;transform-origin:50% 80%}
.grad{background:linear-gradient(90deg,#FFB03A,#FF6B2C 45%,#FF3D8B);-webkit-background-clip:text;color:transparent;
 text-shadow:none;filter:drop-shadow(0 6px 20px rgba(255,80,80,.35))}
.friend{position:absolute;width:210px;margin-left:-105px;text-align:center}
.av{width:170px;height:170px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
 font-size:100px;box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 -8px 0 rgba(0,0,0,.12);border:6px solid rgba(255,255,255,.9)}
.name{font-weight:700;font-size:40px;margin-top:10px}
.bub{position:absolute;white-space:nowrap;background:#fff;color:#1c1830;font-weight:700;font-size:40px;padding:18px 28px;
 border-radius:34px;box-shadow:0 12px 30px rgba(0,0,0,.35);transform-origin:50% 100%}
.bub:after{content:"";position:absolute;left:50%;bottom:-18px;margin-left:-14px;border:14px solid transparent;border-top:18px solid #fff;border-bottom:0}
#wheelwrap{position:absolute;left:540px;top:860px;width:0;height:0}
#wheel{position:absolute;left:-400px;top:-400px;width:800px;height:800px}
#pointer{position:absolute;left:-42px;top:-470px;width:84px;height:100px}
#banner{position:absolute;left:540px;top:860px;width:0;height:0}
#banner .card{position:absolute;left:-400px;top:-230px;width:800px;height:460px;border-radius:60px;
 background:linear-gradient(135deg,#FF8A2C,#FF3D8B);box-shadow:0 30px 80px rgba(255,61,139,.55);text-align:center;padding-top:40px;border:8px solid #fff}
.feat{position:absolute;left:90px;width:900px;height:196px;border-radius:44px;background:rgba(255,255,255,.1);
 border:3px solid rgba(255,255,255,.18);display:flex;align-items:center;padding:0 36px;gap:34px;
 box-shadow:0 20px 50px rgba(0,0,0,.3);backdrop-filter:blur(6px)}
.feat .ic{width:124px;height:124px;flex:none;border-radius:34px;display:flex;align-items:center;justify-content:center;font-size:70px;
 background:linear-gradient(135deg,#FF8A2C,#FF3D8B)}
.feat h3{font-size:52px;font-weight:700;line-height:1.05}
.feat p{font-size:34px;font-weight:600;opacity:.8;margin-top:6px}
#logo{position:absolute;left:0;width:1080px;top:150px;display:flex;justify-content:center;align-items:center;gap:30px}
#logo .tile{width:150px;height:150px;border-radius:42px;background:linear-gradient(135deg,#2a1f45,#141021);display:flex;
 align-items:center;justify-content:center;font-size:90px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#logo .nm{font-size:150px;font-weight:700;letter-spacing:-2px;text-shadow:0 10px 30px rgba(120,20,40,.35)}
#cta{position:absolute;left:540px;top:1690px;width:0;height:0}
#cta div{position:absolute;left:-330px;top:-72px;width:660px;height:144px;border-radius:72px;background:#141021;color:#fff;
 font-size:58px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:20px;box-shadow:0 20px 50px rgba(60,0,30,.45)}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<div id="stage">
 <div id="bg"></div>
 <div id="bg2"></div>
 <div id="rays"></div>
 <div id="glow"></div>
 <canvas id="back" width="1080" height="1920"></canvas>

 <!-- scene 1 text -->
 <div class="t" id="s1a" style="top:250px;font-size:64px;font-weight:600;opacity:.85"></div>
 <div class="t" id="s1b" style="top:350px;font-size:128px"></div>

 <!-- scene 2 friends -->
 <div id="friends"></div>
 <div class="t" id="basta" style="top:640px;font-size:220px"></div>

 <!-- scene 3 -->
 <div class="t" id="s3a" style="top:150px;font-size:84px"></div>
 <div id="wheelwrap">
  <svg id="wheel" viewBox="-400 -400 800 800"></svg>
  <svg id="pointer" viewBox="0 0 84 100"><path d="M6 8 Q42 -6 78 8 L46 94 Q42 100 38 94 Z" fill="#fff" stroke="#1c1830" stroke-width="6"/><circle cx="42" cy="26" r="10" fill="#FF3D8B"/></svg>
 </div>

 <!-- scene 4 -->
 <div class="t" id="s4a" style="top:110px;font-size:80px"></div>
 <div id="feats"></div>

 <!-- scene 5 -->
 <div id="logo"><div class="tile">☕</div><div class="nm">Breakly</div></div>
 <div class="t" id="s5a" style="top:1400px;font-size:74px;text-shadow:0 8px 24px rgba(120,20,40,.35)"></div>
 <div id="cta"><div>Scaricala ora <span style="font-size:50px">📲</span></div></div>

 <div id="shadow"></div>
 <div id="chicca"><img src="body.png"><img id="steam" src="steam.png"><img id="blink" src="blink.png"></div>

 <div id="banner"><div class="card">
   <div style="font-size:150px;line-height:1">🐸</div>
   <div style="font-size:96px;font-weight:700;margin-top:14px">Offre Luca!</div>
   <div style="font-size:46px;font-weight:600;opacity:.9;margin-top:6px">☕ ×4 &nbsp;in arrivo</div>
 </div></div>

 <canvas id="front" width="1080" height="1920"></canvas>
 <div id="flash"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3);
const eIn=k=>k*k*k;
const eIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const eElastic=k=>k===0?0:k===1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*(2*Math.PI)/3)+1;
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

// ---------- word builders ----------
function words(el,txt){el.innerHTML=txt.split(' ').map(w=>w==='/'?'<br>':w[0]==='*'?`<span class="grad">${w.slice(1)}</span>`:`<span>${w}</span>`).join(' ');return [...el.querySelectorAll('span')]}
function popWords(spans,t,t0,st=.09,dur=.45){spans.forEach((s,i)=>{const k=seg(t,t0+i*st,t0+i*st+dur);
  s.style.opacity=clamp(k*3);s.style.transform=`translateY(${(1-eOut(k))*60}px) scale(${lerp(.3,1,eBack(k))}) rotate(${(1-eOut(k))*-8}deg)`})}
const W1=words($('s1a'),'Ore 10:30. Pausa caffè…');
const W1b=words($('s1b'),'Ma… / *chi *offre? 🤔');
const WB=words($('basta'),'BASTA! ✋');
const W3=words($('s3a'),'Decide *Breakly!');
const W4=words($('s4a'),'Zero drammi. / *Solo *caffè.');
const W5=words($('s5a'),'Il caffè? Lo decide il gioco.');

// ---------- friends ----------
const FR=[
 {n:'Marco',e:'🦊',c:'#FFB03A',x:250,y:330,b:'Ho offerto ieri!',bt:3.75,bx:0,by:-120},
 {n:'Giulia',e:'🐼',c:'#8FD3FF',x:830,y:330,b:'Tocca a Luca!',bt:4.35,bx:0,by:-120},
 {n:'Luca',e:'🐸',c:'#7BE38F',x:250,y:830,b:'Non è vero! 😤',bt:4.95,bx:40,by:-120},
 {n:'Sara',e:'🐱',c:'#FF9FD0',x:830,y:830,b:'Io sono a dieta…',bt:5.55,bx:-60,by:-120},
];
FR.forEach(f=>{const d=document.createElement('div');d.className='friend';d.style.left=f.x+'px';d.style.top=f.y+'px';
 d.innerHTML=`<div class="av" style="background:${f.c}">${f.e}</div><div class="name">${f.n}</div>`;
 const b=document.createElement('div');b.className='bub';b.textContent=f.b;d.appendChild(b);$('friends').appendChild(d);f.el=d;f.bub=b});

// ---------- wheel ----------
const WN=[['Marco','🦊','#FFB03A'],['Giulia','🐼','#5BB8F5'],['Luca','🐸','#4CC96A'],['Sara','🐱','#FF6FB5']];
(function(){let s='<circle r="398" fill="#fff"/>';
 WN.forEach((w,i)=>{const a0=(i*90-90)*Math.PI/180,a1=((i+1)*90-90)*Math.PI/180,R=380;
  s+=`<path d="M0 0 L${R*Math.cos(a0)} ${R*Math.sin(a0)} A${R} ${R} 0 0 1 ${R*Math.cos(a1)} ${R*Math.sin(a1)} Z" fill="${w[2]}"/>`;
  const am=i*90+45;s+=`<g transform="rotate(${am})"><text y="-250" text-anchor="middle" font-size="96" dominant-baseline="middle">${w[1]}</text>
   <text y="-140" text-anchor="middle" font-size="52" font-weight="700" fill="#fff" font-family="F">${w[0]}</text></g>`});
 for(let i=0;i<24;i++){const a=i*15*Math.PI/180;s+=`<circle cx="${389*Math.sin(a)}" cy="${-389*Math.cos(a)}" r="7" fill="${i%2?'#FF6B2C':'#FFD27A'}"/>`}
 s+='<circle r="70" fill="#fff"/><circle r="52" fill="#141021"/><text text-anchor="middle" dominant-baseline="central" font-size="56">☕</text>';
 $('wheel').innerHTML=s})();
const SPIN0=8.0,SPIN1=11.2,SPINR=360*5+135; // Luca center (225deg) ends at top
function wheelAngle(t){const k=seg(t,SPIN0,SPIN1);return -20*Math.sin(Math.PI*seg(t,7.7,SPIN0))+SPINR*(1-Math.pow(1-k,4))}
window.wheelAngle=wheelAngle;

// ---------- features ----------
const FE=[['⚡','Partita rapida','Scrivi i nomi e si gioca'],['👥','Modalità gruppo','Sincronizzata tra colleghi'],
 ['📊','Statistiche','Chi offre di più? Lo sai subito'],['🔒','Niente account','Zero registrazioni, privacy vera']];
FE.forEach((f,i)=>{const d=document.createElement('div');d.className='feat';d.style.top=(380+i*232)+'px';
 d.innerHTML=`<div class="ic">${f[0]}</div><div><h3>${f[1]}</h3><p>${f[2]}</p></div>`;$('feats').appendChild(d);f.el=d});

// ---------- particles ----------
const bctx=$('back').getContext('2d'),fctx=$('front').getContext('2d');
const R0=rng(7),BEANS=[...Array(26)].map(()=>({x:R0()*1080,d:R0()*3,sp:600+R0()*700,r:R0()*6.28,vr:(R0()-.5)*6,s:.6+R0()*.9}));
function bean(c,x,y,r,s,a){c.save();c.globalAlpha=a;c.translate(x,y);c.rotate(r);c.scale(s,s);
 c.fillStyle='#6b3a1e';c.beginPath();c.ellipse(0,0,26,36,0,0,7);c.fill();
 c.strokeStyle='#3b1d0c';c.lineWidth=5;c.beginPath();c.moveTo(0,-30);c.bezierCurveTo(-10,-10,10,10,0,30);c.stroke();
 c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(-9,-12,7,12,-.4,0,7);c.fill();c.restore()}
const R1=rng(42),CONF=[...Array(170)].map(()=>{const a=R1()*6.28,v=700+R1()*1500;return{vx:Math.cos(a)*v,vy:Math.sin(a)*v-700,
 r:R1()*6.28,vr:(R1()-.5)*18,w:14+R1()*16,h:8+R1()*10,c:['#FFB03A','#FF6B2C','#FF3D8B','#fff','#7BE38F','#8FD3FF','#FFE45C'][Math.floor(R1()*7)],sw:R1()*6}});
function confetti(c,t,t0,ox,oy){const d=t-t0;if(d<0||d>3.5)return;CONF.forEach(p=>{
 const drag=Math.exp(-1.6*d),k=(1-drag)/1.6;const x=ox+p.vx*k+Math.sin(d*4+p.sw)*30,y=oy+p.vy*k+900*d*d*.5;
 c.save();c.globalAlpha=clamp(3.5-d);c.translate(x,y);c.rotate(p.r+p.vr*d);c.scale(1,Math.cos(d*8+p.sw));c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()})}
const R2=rng(99),SPK=[...Array(40)].map(()=>({a:R2()*6.28,r:120+R2()*520,d:R2()*1.2,s:6+R2()*16}));
function sparkles(c,t,t0,ox,oy,dur=2.2){SPK.forEach(p=>{const d=(t-t0-p.d);if(d<0||d>dur)return;const k=d/dur;
 const x=ox+Math.cos(p.a)*p.r*(.6+k*.5),y=oy+Math.sin(p.a)*p.r*(.6+k*.5),s=p.s*Math.sin(Math.PI*k);
 c.save();c.translate(x,y);c.rotate(k*3);c.fillStyle='#fff';c.globalAlpha=.9;c.beginPath();
 for(let i=0;i<8;i++){const rr=i%2?s*.25:s;const aa=i*Math.PI/4;c.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}c.fill();c.restore()})}
function ring(c,t,t0,ox,oy,col){const d=t-t0;if(d<0||d>.6)return;const k=d/.6;c.save();c.globalAlpha=1-k;c.strokeStyle=col;c.lineWidth=24*(1-k)+2;
 c.beginPath();c.arc(ox,oy,60+k*520,0,7);c.stroke();c.restore()}

// ---------- chicca pose ----------
const CH=$('chicca'),ST=$('steam'),BL=$('blink'),SH=$('shadow');
function beatHop(t,amp){return -Math.abs(Math.sin(Math.PI*2*t))*amp}
function pose(t){
 let x=540,y=1580,s=1,rot=0,sx=1,sy=1,flip=1,op=1;
 // scene1 drop
 if(t<3.4){
  if(t<.95){y=-200}
  else if(t<1.45){const k=eIn(seg(t,.95,1.45));y=lerp(-80,1580,k);sx=.88;sy=1.14}
  else{const d=t-1.45,q=.3*Math.exp(-5.5*d)*Math.cos(17*d);sy=1-q;sx=1+q*.8;
   if(t>2.2)y+=beatHop(t,14);rot=Math.sin(t*3)*2}
 }
 // scene2
 if(t>=3.2&&t<7.6){const k=eIO(seg(t,3.2,3.8));x=540;y=lerp(1580,1860,k);s=lerp(1,.62,k);
  y+=beatHop(t,10)*k;flip=(t>3.9&&t<6.2)?(Math.floor((t-3.75)/.6)%2?-1:1):1;
  const hj=seg(t,6.2,6.75);if(hj>0&&hj<1){y-=Math.sin(Math.PI*hj)*260;s*=1+.15*Math.sin(Math.PI*hj);rot=Math.sin(Math.PI*hj)*-10}
  const land=t-6.75;if(land>0){const q=.25*Math.exp(-6*land)*Math.cos(18*land);sy=1-q;sx=1+q*.8}
 }
 // scene3
 if(t>=7.6&&t<12.6){y=1860;s=.62;const k=eIO(seg(t,7.6,8.0));x=540;
  y+=beatHop(t,8)*(t>11.2?3:1);
  if(t>=8&&t<11.2){rot=Math.sin(t*14)*3*(1-seg(t,10.4,11.2))}
  if(t>11.2){const d=t-11.2;rot=Math.sin(d*12)*8*Math.exp(-d*1.2)}
 }
 // scene4
 if(t>=12.6&&t<16.6){x=540;y=1880;s=.62;rot=Math.sin(Math.PI*2*t)*8;y+=beatHop(t,22);
  const q=Math.abs(Math.cos(Math.PI*2*t));sy=1-.04*(1-q);sx=1+.04*(1-q)}
 // scene5
 if(t>=16.6){const k=seg(t,16.6,17.3);x=540;y=lerp(1880,1330,eBack(k));s=lerp(.62,.95,eOut(k));
  if(t>17.3){const d=t-17.3,q=.18*Math.exp(-5*d)*Math.cos(16*d);sy=1-q;sx=1+q*.8;rot=Math.sin(t*3.2)*3;y+=beatHop(t,10)*seg(t,17.8,18.2)}
  if(t>19.2){const d=t-19.2;s*=1+.04*Math.sin(Math.min(d*8,Math.PI))}
 }
 return{x,y,s,rot,sx,sy,flip,op}}

function blinkAt(t){const B=[2.6,5.2,9.3,14.1,18.3,19.5];return B.some(b=>t>=b&&t<b+.13)}

// ---------- main render ----------
window.render=function(t){
 // backgrounds
 const w5=seg(t,16.45,17.05);
 const P=pose(t);
 $('bg2').style.clipPath=`circle(${eIn(w5)*2400}px at ${P.x}px ${P.y-300*P.s}px)`;
 $('rays').style.top=(t<16.5?P.y-330*P.s:P.y-380*P.s)+'px';
 $('rays').style.transform=`rotate(${t*14}deg) scale(${t<16.5?.8:1.1})`;
 $('rays').style.opacity=t<1.5?0:t<16.5?.35*seg(t,1.5,2.2):.8;
 $('glow').style.left=P.x+'px';$('glow').style.top=(P.y-330*P.s)+'px';$('glow').style.opacity=t<16.5?clamp((t-1.4)*2)*.9:.35;
 $('glow').style.transform=`scale(${P.s*(1+.06*Math.sin(t*6.28))})`;

 // stage shake
 let shx=0,shy=0;const sh=(a,b,m)=>{if(t>a&&t<b){const k=1-seg(t,a,b);shx+=Math.sin(t*93)*m*k;shy+=Math.cos(t*77)*m*k}};
 sh(1.45,1.8,18);sh(6.7,7.1,26);sh(11.2,11.6,20);sh(17.25,17.6,14);
 $('stage').style.transform=`translate(${shx}px,${shy}px)`;

 // chicca
 CH.style.left=(P.x-310)+'px';CH.style.top=(P.y-736)+'px';CH.style.opacity=P.op;
 CH.style.transform=`rotate(${P.rot}deg) scale(${P.s*P.sx*P.flip},${P.s*P.sy})`;
 ST.style.transform=`skewX(${Math.sin(t*5)*5}deg) scaleY(${1+Math.sin(t*3.3)*.05})`;
 BL.style.opacity=blinkAt(t)?1:0;
 SH.style.left=P.x+'px';SH.style.top=(t<1.45?1580:P.y>1500?(t<16.6?Math.max(P.y,1580):1330):P.y)+'px';
 const air=clamp((( (t<1.45?1580:P.base||P.y)) - P.y)/400);
 SH.style.transform=`scale(${P.s*(t<.95?0:t<1.45?seg(t,.95,1.45):1)})`;SH.style.opacity=t<16.6?.9:.5;

 // scene1 text
 popWords(W1,t,.25,.12);popWords(W1b,t,1.7,.14,.5);
 const o1=1-seg(t,3.1,3.4);$('s1a').style.opacity=o1;$('s1b').style.opacity=o1;
 $('s1b').style.transform=`translateY(${-seg(t,3.1,3.4)*80}px)`;

 // scene2 friends
 FR.forEach((f,i)=>{const k=seg(t,3.35+i*.1,3.85+i*.1),out=seg(t,6.72+i*.03,7.2+i*.03);
  const vis=t>3.3&&t<7.6;f.el.style.display=vis?'block':'none';if(!vis)return;
  const dx=(f.x<540?-1:1)*eIn(out)*700;
  const wob=Math.sin(t*9+i)*(t>5.9&&t<6.8?9:2);
  f.el.style.transform=`translate(${dx}px,${-eIn(out)*200}px) scale(${eBack(k)}) rotate(${wob}deg)`;
  const bk=seg(t,f.bt,f.bt+.35),bo=seg(t,6.2,6.45);
  f.bub.style.left=(105-f.bub.offsetWidth/2+f.bx)+'px';f.bub.style.top=f.by+'px';
  f.bub.style.opacity=bk>0?1-bo:0;f.bub.style.transform=`scale(${eBack(bk)*(1-bo)})`});
 popWords(WB,t,6.65,.08,.35);$('basta').style.opacity=1-seg(t,7.3,7.55);
 $('basta').style.transform=`scale(${1+seg(t,7.3,7.55)*.5})`;

 // scene3 wheel
 popWords(W3,t,7.55,.12);$('s3a').style.opacity=1-seg(t,12.45,12.75);
 const wk=seg(t,7.5,8.0),wo=seg(t,12.4,12.8);
 $('wheelwrap').style.display=(t>7.45&&t<12.85)?'block':'none';
 $('wheelwrap').style.transform=`scale(${eBack(wk)*(1-eIn(wo))}) rotate(${(1-eOut(wk))*-90}deg)`;
 $('wheel').style.transform=`rotate(${wheelAngle(t)}deg)`;
 // pointer flick when passing boundaries
 const ang=wheelAngle(t)%90;$('pointer').style.transform=`rotate(${t>8&&t<11.2?-Math.max(0,18-ang*.8):0}deg)`;
 $('pointer').style.transformOrigin='50% 20%';
 const bn=seg(t,11.35,11.8),bo2=seg(t,12.35,12.7);
