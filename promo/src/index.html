<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:F;src:url(f600.woff2);font-weight:600}
@font-face{font-family:F;src:url(f700.woff2);font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#141021}
body{font-family:F,"Noto Color Emoji",sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,#3a2560 0%,#1d1533 45%,#110d1d 100%)}

#rays{position:absolute;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;border-radius:50%;
 background:repeating-conic-gradient(rgba(255,255,255,.10) 0 10deg,rgba(255,255,255,0) 10deg 20deg);
 -webkit-mask:radial-gradient(circle,#000 0,#000 25%,transparent 60%)}
#glow{position:absolute;width:1100px;height:1100px;border-radius:50%;margin:-550px 0 0 -550px;
 background:radial-gradient(circle,rgba(255,120,50,.45),rgba(255,61,139,.15) 45%,transparent 70%)}
canvas{position:absolute;inset:0}
#chicca{position:absolute;width:620px;height:736px;transform-origin:50% 100%}
#chicca img{position:absolute;left:0;top:0;width:100%;height:100%}
#steam{transform-origin:50% 31.5%}
#shadow{position:absolute;width:420px;height:60px;margin:-30px 0 0 -210px;border-radius:50%;
 background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%)}
.t{position:absolute;text-align:center;font-weight:700;line-height:1.08;text-shadow:0 8px 30px rgba(0,0,0,.35)}
.t span{display:inline-block;transform-origin:50% 80%}
.grad{background:linear-gradient(90deg,#FFB03A,#FF6B2C 45%,#FF3D8B);-webkit-background-clip:text;color:transparent;
 text-shadow:none;filter:drop-shadow(0 6px 20px rgba(255,80,80,.35))}
.friend{position:absolute;width:210px;margin-left:-105px;text-align:center}
.av{width:170px;height:170px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
 font-size:100px;box-shadow:0 14px 40px rgba(0,0,0,.4),inset 0 -8px 0 rgba(0,0,0,.12);border:6px solid rgba(255,255,255,.9)}
.name{font-weight:700;font-size:40px;margin-top:10px}
.bub{position:absolute;white-space:nowrap;background:#fff;color:#1c1830;font-weight:700;font-size:40px;padding:18px 28px;
 border-radius:34px;box-shadow:0 12px 30px rgba(0,0,0,.35);transform-origin:50% 100%}
.bub:after{content:"";position:absolute;left:50%;bottom:-18px;margin-left:-14px;border:14px solid transparent;border-top:18px solid #fff;border-bottom:0}
#wheelwrap,#banner,#cta{position:absolute;width:0;height:0}
#wheel{position:absolute;left:-400px;top:-400px;width:800px;height:800px}
#pointer{position:absolute;left:-42px;top:-470px;width:84px;height:100px;transform-origin:50% 20%}
#banner .card{position:absolute;left:-400px;top:-230px;width:800px;height:460px;border-radius:60px;
 background:linear-gradient(135deg,#FF8A2C,#FF3D8B);box-shadow:0 30px 80px rgba(255,61,139,.55);text-align:center;padding-top:40px;border:8px solid #fff}
.feat{position:absolute;border-radius:44px;background:rgba(255,255,255,.1);

.h .feat h3{font-size:46px}.h .feat p{font-size:30px}.h .feat .ic{width:110px;height:110px;font-size:62px}
#logo{position:absolute;display:flex;justify-content:center;align-items:center;gap:30px}

#cta .btn{position:absolute;left:-340px;top:-72px;width:680px;height:144px;border-radius:72px;background:#141021;color:#fff;
 font-size:60px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:20px;box-shadow:0 20px 50px rgba(60,0,30,.45)}
#stores{position:absolute;display:flex;justify-content:center;gap:24px}
#stores div{background:rgba(255,255,255,.95);color:#1c1830;font-weight:700;font-size:40px;padding:14px 34px;border-radius:999px;
 box-shadow:0 12px 30px rgba(60,0,30,.3);display:flex;align-items:center;gap:14px}
#stores svg{width:40px;height:40px}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<div id="stage">
 <div id="bg"></div>
 <div id="bg2"></div>
 <div id="rays"></div>
 <div id="glow"></div>
 <canvas id="back"></canvas>

 <div id="friends"></div>

 <div class="t" id="s4a" style="font-size:80px"></div>

 </div></div>

</div>
<script>
const $=id=>document.getElementById(id);
const H=location.search.includes('h');
const VW=H?1920:1080,VH=H?1080:1920;
if(H)document.body.classList.add('h');
document.documentElement.style.width=document.body.style.width=VW+'px';
document.documentElement.style.height=document.body.style.height=VH+'px';

// ---------- layout per aspect ratio ----------
const LV={
 s1:{x:540,y:1580,s:1}, s2:{x:540,y:1860,s:.62}, s3:{x:540,y:1860,s:.62}, s4:{x:540,y:1880,s:.62}, s5:{x:540,y:1330,s:.95},
 friends:[[250,330],[830,330],[250,830],[830,830]],
 wheel:{x:540,y:860,sc:1},
 text:{s1a:[0,250,1080],s1b:[0,350,1080],basta:[0,640,1080],s3a:[0,150,1080],s4a:[0,110,1080],s5a:[0,1400,1080]},
 feats:i=>({l:90,t:380+i*232,w:900,h:196,from:900}),
 logo:[0,150,1080], cta:[540,1690], stores:[0,1795,1080],
};
const LH={
 s1:{x:1400,y:1020,s:.9}, s2:{x:440,y:1060,s:.6}, s3:{x:360,y:1060,s:.6}, s4:{x:340,y:1070,s:.6}, s5:{x:560,y:1020,s:.85},
 friends:[[960,170],[1560,170],[960,600],[1560,600]],
 wheel:{x:1200,y:585,sc:.8},
 text:{s1a:[80,330,1000],s1b:[80,420,1000],basta:[700,390,1120],s3a:[700,36,1000],s4a:[700,70,1220],s5a:[800,440,1060]},
 feats:i=>({l:700+(i%2)*610,t:330+Math.floor(i/2)*300,w:580,h:250,from:1300}),
 logo:[800,170,1060], cta:[1330,730], stores:[800,850,1060],
};
const L=H?LH:LV;
function place(id,[l,t,w]){const e=$(id);e.style.left=l+'px';e.style.top=t+'px';e.style.width=w+'px'}
Object.entries(L.text).forEach(([k,v])=>place(k,v));
place('logo',L.logo);place('stores',L.stores);
$('cta').style.left=L.cta[0]+'px';$('cta').style.top=L.cta[1]+'px';
$('wheelwrap').style.left=$('banner').style.left=L.wheel.x+'px';
$('wheelwrap').style.top=$('banner').style.top=L.wheel.y+'px';
['back','front'].forEach(id=>{$(id).width=VW;$(id).height=VH});

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;
const eOut=k=>1-Math.pow(1-k,3);
const eIn=k=>k*k*k;
const eIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const eBack=k=>{const c1=2.2,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
const eElastic=k=>k===0?0:k===1?1:Math.pow(2,-10*k)*Math.sin((k*10-.75)*(2*Math.PI)/3)+1;
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

// ---------- word builders ----------
function words(el,txt){el.innerHTML=txt.split(' ').map(w=>w==='/'?'<br>':w[0]==='*'?`<span class="grad">${w.slice(1)}</span>`:`<span>${w}</span>`).join(' ');return [...el.querySelectorAll('span')]}
function popWords(spans,t,t0,st=.09,dur=.45){spans.forEach((s,i)=>{const k=seg(t,t0+i*st,t0+i*st+dur);
  s.style.opacity=clamp(k*3);s.style.transform=`translateY(${(1-eOut(k))*60}px) scale(${lerp(.3,1,eBack(k))}) rotate(${(1-eOut(k))*-8}deg)`})}
const W1=words($('s1a'),'Ore 10:30. Pausa caffè…');
const W1b=words($('s1b'),'Ma… / *chi *offre? 🤔');
const WB=words($('basta'),'BASTA! ✋');
const W3=words($('s3a'),'Decide *Breakly!');
const W4=words($('s4a'),H?'Zero drammi. *Solo *caffè.':'Zero drammi. / *Solo *caffè.');
const W5=words($('s5a'),H?'Il caffè? / Lo decide il gioco.':'Il caffè? Lo decide il gioco.');

// ---------- friends ----------
const FR=[
 {n:'Marco',e:'🦊',c:'#FFB03A',b:'Ho offerto ieri!',bt:3.75,bx:0,by:-120},
 {n:'Giulia',e:'🐼',c:'#8FD3FF',b:'Tocca a Luca!',bt:4.35,bx:0,by:-120},
 {n:'Luca',e:'🐸',c:'#7BE38F',b:'Non è vero! 😤',bt:4.95,bx:40,by:-120},
 {n:'Sara',e:'🐱',c:'#FF9FD0',b:'Io sono a dieta…',bt:5.55,bx:-60,by:-120},
];
FR.forEach((f,i)=>{[f.x,f.y]=L.friends[i];const d=document.createElement('div');d.className='friend';d.style.left=f.x+'px';d.style.top=f.y+'px';
 d.innerHTML=`<div class="av" style="background:${f.c}">${f.e}</div><div class="name">${f.n}</div>`;
 const b=document.createElement('div');b.className='bub';b.textContent=f.b;d.appendChild(b);$('friends').appendChild(d);f.el=d;f.bub=b;
 f.side=f.x<(H?1260:540)?-1:1});

// ---------- wheel ----------
const WN=[['Marco','🦊','#FFB03A'],['Giulia','🐼','#5BB8F5'],['Luca','🐸','#4CC96A'],['Sara','🐱','#FF6FB5']];
(function(){let s='<circle r="398" fill="#fff"/>';
 WN.forEach((w,i)=>{const a0=(i*90-90)*Math.PI/180,a1=((i+1)*90-90)*Math.PI/180,R=380;
  s+=`<path d="M0 0 L${R*Math.cos(a0)} ${R*Math.sin(a0)} A${R} ${R} 0 0 1 ${R*Math.cos(a1)} ${R*Math.sin(a1)} Z" fill="${w[2]}"/>`;
  const am=i*90+45;s+=`<g transform="rotate(${am})"><text y="-250" text-anchor="middle" font-size="96" dominant-baseline="middle">${w[1]}</text>
   <text y="-140" text-anchor="middle" font-size="52" font-weight="700" fill="#fff" font-family="F">${w[0]}</text></g>`});
 for(let i=0;i<24;i++){const a=i*15*Math.PI/180;s+=`<circle cx="${389*Math.sin(a)}" cy="${-389*Math.cos(a)}" r="7" fill="${i%2?'#FF6B2C':'#FFD27A'}"/>`}
 s+='<circle r="74" fill="#fff"/><clipPath id="lc"><rect x="-62" y="-62" width="124" height="124" rx="30"/></clipPath><image href="logo.png" x="-62" y="-62" width="124" height="124" clip-path="url(#lc)"/>';
 $('wheel').innerHTML=s})();
const SPIN0=8.0,SPIN1=11.2,SPINR=360*5+135; // Luca center (225deg) ends at top
function wheelAngle(t){const k=seg(t,SPIN0,SPIN1);return -20*Math.sin(Math.PI*seg(t,7.7,SPIN0))+SPINR*(1-Math.pow(1-k,4))}

// ---------- features ----------
const FE=[['⚡','Partita rapida','Scrivi i nomi e si gioca'],['👥','Modalità gruppo','Sincronizzata tra colleghi'],
 ['📊','Statistiche','Chi offre di più? Lo sai subito'],['🔒','Niente account','Zero registrazioni, privacy vera']];
FE.forEach((f,i)=>{const d=document.createElement('div');d.className='feat';const g=L.feats(i);f.g=g;
 Object.assign(d.style,{left:g.l+'px',top:g.t+'px',width:g.w+'px',height:g.h+'px'});
 d.innerHTML=`<div class="ic">${f[0]}</div><div><h3>${f[1]}</h3><p>${f[2]}</p></div>`;$('feats').appendChild(d);f.el=d});

// ---------- particles ----------
const bctx=$('back').getContext('2d'),fctx=$('front').getContext('2d');
const R0=rng(7),BEANS=[...Array(H?34:26)].map(()=>({x:R0()*VW,d:R0()*3,sp:(600+R0()*700)*VH/1920,r:R0()*6.28,vr:(R0()-.5)*6,s:.6+R0()*.9}));
function bean(c,x,y,r,s,a){c.save();c.globalAlpha=a;c.translate(x,y);c.rotate(r);c.scale(s,s);
 c.fillStyle='#6b3a1e';c.beginPath();c.ellipse(0,0,26,36,0,0,7);c.fill();
 c.strokeStyle='#3b1d0c';c.lineWidth=5;c.beginPath();c.moveTo(0,-30);c.bezierCurveTo(-10,-10,10,10,0,30);c.stroke();
 c.fillStyle='rgba(255,255,255,.18)';c.beginPath();c.ellipse(-9,-12,7,12,-.4,0,7);c.fill();c.restore()}
const R1=rng(42),CONF=[...Array(170)].map(()=>{const a=R1()*6.28,v=700+R1()*1500;return{vx:Math.cos(a)*v,vy:Math.sin(a)*v-700,
 r:R1()*6.28,vr:(R1()-.5)*18,w:14+R1()*16,h:8+R1()*10,c:['#FFB03A','#FF6B2C','#FF3D8B','#fff','#7BE38F','#8FD3FF','#FFE45C'][Math.floor(R1()*7)],sw:R1()*6}});
function confetti(c,t,t0,ox,oy){const d=t-t0;if(d<0||d>3.5)return;CONF.forEach(p=>{
 const drag=Math.exp(-1.6*d),k=(1-drag)/1.6;const x=ox+p.vx*k+Math.sin(d*4+p.sw)*30,y=oy+p.vy*k+900*d*d*.5;
 c.save();c.globalAlpha=clamp(3.5-d);c.translate(x,y);c.rotate(p.r+p.vr*d);c.scale(1,Math.cos(d*8+p.sw));c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()})}
const R2=rng(99),SPK=[...Array(40)].map(()=>({a:R2()*6.28,r:120+R2()*520,d:R2()*1.2,s:6+R2()*16}));
function sparkles(c,t,t0,ox,oy,dur=2.2){SPK.forEach(p=>{const d=(t-t0-p.d);if(d<0||d>dur)return;const k=d/dur;
 const x=ox+Math.cos(p.a)*p.r*(.6+k*.5),y=oy+Math.sin(p.a)*p.r*(.6+k*.5),s=p.s*Math.sin(Math.PI*k);
 c.save();c.translate(x,y);c.rotate(k*3);c.fillStyle='#fff';c.globalAlpha=.9;c.beginPath();
 for(let i=0;i<8;i++){const rr=i%2?s*.25:s;const aa=i*Math.PI/4;c.lineTo(Math.cos(aa)*rr,Math.sin(aa)*rr)}c.fill();c.restore()})}
function ring(c,t,t0,ox,oy,col){const d=t-t0;if(d<0||d>.6)return;const k=d/.6;c.save();c.globalAlpha=1-k;c.strokeStyle=col;c.lineWidth=24*(1-k)+2;
 c.beginPath();c.arc(ox,oy,60+k*520,0,7);c.stroke();c.restore()}

// ---------- chicca pose ----------
const CH=$('chicca'),ST=$('steam'),BL=$('blink'),SH=$('shadow');
function beatHop(t,amp){return -Math.abs(Math.sin(Math.PI*2*t))*amp}
function mv(a,b,k){return{x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k),s:lerp(a.s,b.s,k)}}
function pose(t){
 let x,y,s,g,rot=0,sx=1,sy=1,flip=1;
 if(t<3.2){({x,y,s}=L.s1);g=y;
  if(t<.95){y=-300}
  else if(t<1.45){const k=eIn(seg(t,.95,1.45));y=lerp(-80,L.s1.y,k);sx=.88;sy=1.14}
  else{const d=t-1.45,q=.3*Math.exp(-5.5*d)*Math.cos(17*d);sy=1-q;sx=1+q*.8;
   if(t>2.2)y+=beatHop(t,14);rot=Math.sin(t*3)*2}
 }else if(t<7.6){const k=eIO(seg(t,3.2,3.8));({x,y,s}=mv(L.s1,L.s2,k));g=y;
  y+=beatHop(t,10)*k;flip=(t>3.9&&t<6.2)?(Math.floor((t-3.75)/.6)%2?-1:1):1;
  const hj=seg(t,6.2,6.75);if(hj>0&&hj<1){y-=Math.sin(Math.PI*hj)*(H?200:260);s*=1+.15*Math.sin(Math.PI*hj);rot=Math.sin(Math.PI*hj)*-10}
  const land=t-6.75;if(land>0){const q=.25*Math.exp(-6*land)*Math.cos(18*land);sy=1-q;sx=1+q*.8}
 }else if(t<12.6){const k=eIO(seg(t,7.6,8.0));({x,y,s}=mv(L.s2,L.s3,k));g=y;
  y+=beatHop(t,8)*(t>11.2?3:1);
  if(t>=8&&t<11.2){rot=Math.sin(t*14)*3*(1-seg(t,10.4,11.2))}
  if(t>11.2){const d=t-11.2;rot=Math.sin(d*12)*8*Math.exp(-d*1.2)}
 }else if(t<16.6){const k=eIO(seg(t,12.6,13.0));({x,y,s}=mv(L.s3,L.s4,k));g=y;
  rot=Math.sin(Math.PI*2*t)*8;y+=beatHop(t,22);
  const q=Math.abs(Math.cos(Math.PI*2*t));sy=1-.04*(1-q);sx=1+.04*(1-q)
 }else{const k=seg(t,16.6,17.3);x=lerp(L.s4.x,L.s5.x,eOut(k));y=lerp(L.s4.y,L.s5.y,eBack(k));s=lerp(L.s4.s,L.s5.s,eOut(k));g=L.s5.y;
  if(t>17.3){const d=t-17.3,q=.18*Math.exp(-5*d)*Math.cos(16*d);sy=1-q;sx=1+q*.8;rot=Math.sin(t*3.2)*3;y+=beatHop(t,10)*seg(t,17.8,18.2)}
  if(t>19.2){const d=t-19.2;s*=1+.04*Math.sin(Math.min(d*8,Math.PI))}
 }
 return{x,y,s,g,rot,sx,sy,flip}}
function blinkAt(t){const B=[2.6,5.2,9.3,14.1,18.3,19.5];return B.some(b=>t>=b&&t<b+.13)}

// ---------- main render ----------
window.render=function(t){
 const P=pose(t),cy=P.y-330*P.s;
 const w5=seg(t,16.45,17.05);
 $('bg2').style.clipPath=`circle(${eIn(w5)*2600}px at ${P.x}px ${cy}px)`;
 $('rays').style.left=P.x+'px';$('rays').style.top=(t<16.5?cy:P.y-380*P.s)+'px';
 $('rays').style.transform=`rotate(${t*14}deg) scale(${t<16.5?.8:1.1})`;
 $('rays').style.opacity=t<1.5?0:t<16.5?.35*seg(t,1.5,2.2):.8;
 $('glow').style.left=P.x+'px';$('glow').style.top=cy+'px';$('glow').style.opacity=t<16.5?clamp((t-1.4)*2)*.9:.35;
